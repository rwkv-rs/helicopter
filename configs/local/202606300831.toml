[experiment]
name = "maxrl-dapo-math-17k"
project = "helicopter-math"
seed = 42
optimizer_steps = 200

[model]
name = "g1h-7.2b"
checkpoint = "${WEIGHT_PATH}/rwkv7-g1h-7.2b-20260710-ctx10240.pth"
prompt_mode = "open_think"

[data.train]
files = ["${DATASETS_PATH}/DAPO/dapo-math-17k-processed.parquet"]
prompt_field = "source_prompt"

[data.validation]

[[data.validation.suites]]
name = "aime24"
file = "${DATASETS_PATH}/AIME24/test.parquet"

[[data.validation.suites]]
name = "aime25"
file = "${DATASETS_PATH}/AIME25/test.parquet"

[[data.validation.suites]]
name = "amc23"
file = "${DATASETS_PATH}/AMC23/test.parquet"

[[data.validation.suites]]
name = "math500"
file = "${DATASETS_PATH}/math500/test.parquet"

[algorithm]
name = "maxrl"
prompts_per_step = 32
responses_per_prompt = 16
ppo_clip = 0.2
dual_clip = 3.0
entropy_coefficient = 0.0
kl_coefficient = 0.0

[reward]
manager = "dapo"
scorer = "math_verify"

[optimizer]
learning_rate = 1e-6
warmup_steps = 0
weight_decay = 0.01
gradient_norm_limit = 0.3

[generation.train]
temperature = 1.0
top_k = -1
top_p = 0.95

[generation.validation]
strategy = "sample"
responses_per_prompt = 8
temperature = 0.96
top_k = 32
top_p = 0.76
presence_penalty = 1.0
frequency_penalty = 0.1
penalty_decay = 0.988

[execution]
nodes = 1
gpus_per_node = 8
wkv_mode = "fp32io16"
context_mode = "state_passing"
state_chunk_tokens = 2048

[execution.rollout]
replicas = 8
tensor_parallel_size_per_replica = 1
pipeline_parallel_size_per_replica = 1
max_concurrent_sequences_per_replica = 64
generation_token_budget_per_replica = 8192
weight_update_bucket_mib = 64

[evaluation]
before_training = true
every_optimizer_steps = 50
output_directory = "logs/validation/maxrl-dapo-math-17k"

[checkpoint]
every_optimizer_steps = 50

[logging]
backends = ["console", "file", "wandb"]

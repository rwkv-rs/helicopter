[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "helicopter"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = []

[project.scripts]
helicopter = "helicopter_cli.__main__:main"

[dependency-groups]
flash-rwkv = [
  "flash-rwkv",
]

fla-rwkv = [
  "flash-linear-attention[cuda]",
]

lighteval = [
  { include-group = "vllm-rwkv" },
  "httpx[socks]",
  "langcodes[data]",
  "lighteval[extended-tasks,math,multilingual] @ git+https://github.com/huggingface/lighteval.git@64f4f5ae173626509fad6e477ca4ee56ebb26129",
  "more-itertools",
  "pyarrow>=19.0.0",
  "ray",
]

lm-eval = [
  # lm-eval 0.4.12 still ships dataset-script tasks such as CMMLU. Datasets 4+
  # removed script loading, so keep this evaluator environment compatible.
  "datasets==3.6.0",
  "httpx[socks]",
  "lm-eval[ifeval,longbench]==0.4.12",
]

vllm-rwkv = [
  "aiohttp>=3.13.3",
  "blake3",
  "cachetools",
  "cbor2",
  "cloudpickle",
  "cmake>=3.26.1",
  "fastapi[standard]>=0.133.0,<0.137.0",
  "filelock>=3.16.1",
  "jinja2>=3.1.6",
  "msgspec",
  "model-hosting-container-standards>=0.1.14,<1.0.0",
  "ninja",
  "numpy",
  "openai>=2.0.0",
  "openai-harmony>=0.0.3",
  "packaging>=24.2",
  "partial-json-parser",
  "pillow",
  "prometheus_client>=0.18.0",
  "prometheus-fastapi-instrumentator>=8.0.0",
  "protobuf>=5.29.6,!=6.30.*,!=6.31.*,!=6.32.*,!=6.33.0.*,!=6.33.1.*,!=6.33.2.*,!=6.33.3.*,!=6.33.4.*",
  "pybase64",
  "psutil",
  "py-cpuinfo",
  "pydantic>=2.12.0",
  "pyyaml",
  "python-json-logger",
  "pyzmq>=25.0.0",
  "regex",
  "requests>=2.26.0",
  "safetensors>=0.6.2",
  "setproctitle",
  "setuptools>=77.0.3,<81.0.0",
  "setuptools-rust>=1.9.0",
  "setuptools-scm>=8.0",
  "starlette>=1.0.1",
  "tokenizers>=0.21.1",
  "torch==2.11.0",
  "tqdm",
  "transformers>=5.5.3",
  "typing_extensions>=4.10",
  "watchfiles",
  "wheel",
]

verl-rwkv = [
  "accelerate",
  "codetiming",
  "datasets",
  "dill",
  "fastapi",
  "hydra-core",
    "latex2sympy2-extended",
    "math-verify",
    "numpy>=2.0.0",
    "nvidia-ml-py>=12.560.30",
    "nvtx==0.2.15",
  "packaging>=20.0",
  "pandas",
  "peft",
  "pyarrow>=19.0.0",
  "pybind11",
  "pylatexenc",
  "ray[default]>=2.41.0",
  "tensorboard",
  "tensordict>=0.8.0,<=0.10.0,!=0.9.0",
  "torch==2.11.0",
  "torchdata",
  "transferqueue==0.1.8",
  "transformers>=5.5.3,!=5.6.0,<5.11",
  "uvicorn",
  "wandb",
  "zstandard",
]

rwkv-lm = [
  "deepspeed",
  "numpy>=2.0.0",
  "pytorch-lightning==1.9.5",
  "torch==2.11.0",
]

dev = [
  "anthropic>=0.71.0",
  "pre-commit",
  "pyarrow>=19.0.0",
  "pytest",
  "pytest-asyncio",
  "tblib",
]

test = [
  { include-group = "dev" },
  "datasets",
  "pyarrow>=19.0.0",
]

verl-liger = [
  "liger-kernel",
]

[tool.uv]
package = true
default-groups = []
conflicts = [
  [
    { group = "lighteval" },
    { group = "verl-rwkv" },
  ],
  [
    # These evaluators intentionally use separate virtual environments:
    # LightEval requires datasets>=4 while lm-eval CMMLU requires 3.6.
    { group = "lighteval" },
    { group = "lm-eval" },
  ],
]

[tool.uv.sources]
flash-rwkv = { path = "src/kernel/flash-rwkv", editable = true }
flash-linear-attention = { path = "src/kernel/fla-rwkv", editable = true }

[tool.setuptools]
packages = ["helicopter_cli", "helicopter_lighteval", "helicopter_lm_eval"]

[tool.setuptools.package-dir]
helicopter_cli = "src/cli/helicopter_cli"
helicopter_lighteval = "src/eval/lighteval"
helicopter_lm_eval = "src/eval/lm_eval"

[tool.pytest.ini_options]
asyncio_mode = "auto"

name: Tests

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Set up Python
        uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0

      - name: Install lightweight test dependencies
        run: |
          uv sync --frozen --no-default-groups --group dev
          VIRTUAL_ENV=.venv uv sync \
            --project src/scoreboard-server \
            --active \
            --inexact \
            --frozen \
            --no-default-groups \
            --group dev

      - name: Run lightweight tests
        env:
          PYTHONPATH: src/cli:src/scoreboard-server
        run: |
          source .venv/bin/activate
          python -m unittest discover -s tests
          python -m pytest -q \
            tests/test_eval_config.py \
            tests/test_eval_evaluate.py \
            tests/test_eval_publish.py
